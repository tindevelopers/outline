name: Build and publish image

# Builds this fork's image and publishes it to GHCR on every push to main.
#
# Two stages are required because `Dockerfile` does not compile anything: it
# only repackages a base image. Building it without overriding `BASE_IMAGE`
# pulls the published `outlinewiki/outline-base`, which contains upstream
# Outline and none of this fork's changes.
#
# The two stages deliberately use different builders:
#
#   - The base stage runs under buildx so it can use the GitHub Actions cache,
#     which makes the expensive `yarn install --immutable` layer reusable across
#     commits. `load: true` puts the result in the Docker daemon's image store.
#   - The final stage runs under plain `docker build`, because buildx's
#     docker-container driver keeps a separate image store and cannot see an
#     image that was loaded into the daemon. Under buildx, `BASE_IMAGE` would be
#     resolved as a registry reference and fail with "pull access denied".
#
# Only linux/amd64 is built, matching the deployment target. GitHub's standard
# ubuntu runners are amd64, so the build is native rather than emulated.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BASE_IMAGE: outline-base:local

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # Fail loudly rather than publishing an image of upstream Outline.
      - name: Verify the base contains this fork
        run: |
          docker run --rm --entrypoint sh "$BASE_IMAGE" -c \
            'grep -rl "ops.teams.impersonate" build/server/routes/api/ops/ops.js'

      - name: Build and publish final image
        run: |
          set -euo pipefail

          args=(--build-arg "BASE_IMAGE=${BASE_IMAGE}")
          # Baked into the image and surfaced as `env.VERSION`, so the running
          # app can report the revision it was built from.
          args+=(--build-arg "SOURCE_COMMIT=${GITHUB_SHA}")

          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"

          while IFS= read -r label; do
            [ -n "$label" ] && args+=(--label "$label")
          done <<< "${{ steps.meta.outputs.labels }}"

          docker build "${args[@]}" .

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "::group::Pushing $tag"
            docker push "$tag"
            echo "::endgroup::"
          done <<< "${{ steps.meta.outputs.tags }}"

      # Guard against publishing a foreign-architecture image, which would fail
      # with `exec format error` on an x86-64 host rather than at build time.
      - name: Verify published architecture
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${GITHUB_SHA::7}"
          arch=$(docker image inspect "$image" --format '{{.Architecture}}')
          echo "Published architecture: $arch"
          [ "$arch" = "amd64" ] || { echo "::error::expected amd64, got $arch"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Architecture | linux/amd64 |"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "| Image | \`$tag\` |"
            done <<< "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
