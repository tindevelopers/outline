name: Build and publish image

# Builds this fork's image and publishes it to GHCR on every push to main.
#
# Two stages are required because `Dockerfile` does not compile anything: it
# only repackages a base image. Building it without overriding `BASE_IMAGE`
# pulls the published `outlinewiki/outline-base`, which contains upstream
# Outline and none of this fork's changes.
#
# The base is built and loaded into the runner's local Docker daemon, then the
# final stage consumes it by that local tag. This avoids publishing the
# intermediate base image and avoids digest pinning.
#
# Only linux/amd64 is built, matching the deployment target. GitHub's standard
# ubuntu runners are amd64, so the build is native rather than emulated.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  BASE_IMAGE: outline-base:local

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # The expensive layer is `yarn install --immutable`, which is keyed off
      # package.json and yarn.lock and therefore caches well across commits.
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: ${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # Fail loudly rather than publishing an image of upstream Outline.
      - name: Verify the base contains this fork
        run: |
          docker run --rm --entrypoint sh "$BASE_IMAGE" -c \
            'grep -rl "ops.teams.impersonate" build/server/routes/api/ops/ops.js'

      - name: Build and publish final image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=final
          cache-to: type=gha,scope=final,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "| Tag | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "| Image | \`$tag\` |"
            done <<< "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
